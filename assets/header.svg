<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="80%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Wave 1 Gradient -->
    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5865f2" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Wave 2 Gradient -->
    <linearGradient id="wave2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3730a3" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5865f2" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="gamepadGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="240" fill="url(#bgGrad)"/>

  <!-- Fluid Cyber Waves -->
  <path d="M 0 160 C 200 130, 380 200, 560 170 C 740 140, 880 180, 1000 150 L 1000 240 L 0 240 Z" fill="url(#wave1Grad)"/>
  <path d="M 0 185 C 240 155, 420 220, 620 185 C 800 150, 900 195, 1000 175 L 1000 240 L 0 240 Z" fill="url(#wave2Grad)"/>

  <!-- Discord Gaming Gamepad Icon -->
  <g transform="translate(500, 60)" text-anchor="middle" filter="url(#gamepadGlow)">
    <!-- Controller Body -->
    <path d="M -24 -6 C -28 -16, -18 -22, -8 -20 L 8 -20 C 18 -22, 28 -16, 24 -6 L 27 16 C 29 24, 21 28, 15 22 L 7 14 L -7 14 L -15 22 C -21 28, -29 24, -27 16 Z" 
          fill="#1e1b4b" stroke="#818cf8" stroke-width="2"/>
    <!-- D-Pad -->
    <path d="M -15 -8 L -11 -8 M -13 -10 L -13 -6" stroke="#c7d2fe" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Action Buttons -->
    <circle cx="12" cy="-9" r="1.6" fill="#38bdf8"/>
    <circle cx="16" cy="-6" r="1.6" fill="#4ade80"/>
    <circle cx="12" cy="-3" r="1.6" fill="#f43f5e"/>
    <circle cx="8" cy="-6" r="1.6" fill="#fbbf24"/>
  </g>

  <!-- Main Title -->
  <text x="500" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="2">
    DISCORD PRESENCE FARMER
  </text>

  <!-- Subtitle -->
  <text x="500" y="152" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="600" fill="#c7d2fe" letter-spacing="0.5">
    24/7 Discord Gateway v10 Game Playtime &amp; Badge Farmer Daemon
  </text>
</svg>
